[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adorable_thunder"
version = "0.1.0"
description = "Data generators library"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.40.0",
    "case-converter>=1.2.0",
    "deepagents>=0.5.3",
    "humanfriendly>=10.0",
    "langgraph>=0.2.0",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "pydantic>=2.12.5",
    "tabulate>=0.10.0",
    "typer>=0.24.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "pyright",
    "commitizen",
]

[tool.hatch.build.targets.wheel]
packages = ["src/adorable_thunder"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["src"]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
version_files = [
    "pyproject.toml:^version",
    "src/adorable_thunder/__init__.py:^__version__",
]
tag_format = "v$version"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "pyright",
    "commitizen",
    "pandas-stubs>=2.3.3.260113",
]
